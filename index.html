<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人在线工具箱 | Tools Hub</title>
<style>
  :root {
    --bg-deep: #0a0e1a;
    --bg-panel: rgba(16, 22, 48, 0.85);
    --bg-hover: rgba(30, 40, 80, 0.6);
    --border: rgba(100, 130, 255, 0.15);
    --border-active: rgba(0, 212, 255, 0.5);
    --text: #d0d8f0;
    --text-dim: #6b7a9c;
    --accent: #00d4ff;
    --accent-2: #8b5cf6;
    --accent-glow: rgba(0, 212, 255, 0.2);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 20px 20px;
    line-height: 1.6;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-active);
    background: rgba(0, 212, 255, 0.08);
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.subtitle {
    color: var(--text-dim);
    font-size: 14px;
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }
  .tool-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    backdrop-filter: blur(10px);
  }
  .tool-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-active);
    box-shadow: 0 10px 30px var(--accent-glow);
    background: var(--bg-hover);
  }
  .card-icon {
    font-size: 36px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 24px;
    flex-grow: 1;
  }
  .card-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .card-action svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s;
  }
  .tool-card:hover .card-action svg {
    transform: translateX(4px);
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    padding-top: 20px;
    border-top: 1px solid rgba(100, 130, 255, 0.08);
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge"><span class="dot"></span> PERSONAL WEB HUB</div>
      <h1>个人<span>在线工具箱</span></h1>
      <p class="subtitle">轻量 · 高效 · 纯本地浏览器运行</p>
    </header>

    <div class="tools-grid">
      <!-- 工具 1 -->
      <a href="./tvboxtools.html" class="tool-card">
        <div>
          <div class="card-icon">📺</div>
          <div class="card-title">TVBox 线路解析工具</div>
          <div class="card-desc">解析接口配置，一键提取 jar/py/js/json 依赖文件，生成批量下载与打包。</div>
        </div>
        <div class="card-action">
          立即打开
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>

      <!-- 工具 2 (按实际文件名修改 href) -->
      <a href="./状态互查2.0.html" class="tool-card">
        <div>
          <div class="card-icon">📊</div>
          <div class="card-title">状态互查工具 2.0</div>
          <div class="card-desc">方便快捷的数据对比与状态在线互查工具。</div>
        </div>
        <div class="card-action">
          立即打开
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>
    </div>
  </div>

  <footer>
    GitHub Pages 个人站点 · 纯前端安全运行
  </footer>
</body>
</html>
