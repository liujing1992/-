<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人在线工具箱</title>
<style>
  :root {
    --bg-dark: #0f3a23;
    --bg-light: #1a5c3a;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #e0f2e9;
    --text-dim: #8fbfa8;
    --accent: #34d399;
    --red: #ef4444;
    --orange: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-dark), var(--bg-light));
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    backdrop-filter: blur(20px);
  }
  .hub-tag {
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 16px;
    background: var(--glass);
    color: var(--accent);
  }
  h1 {
    font-size: 32px;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  h1 span { color: var(--accent); }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
  
  .grid {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .card {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }
  .card-icon { font-size: 32px; margin-bottom: 12px; display: block; }
  .card-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .card-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }
  .card-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: inline-block;
  }
  
  /* SD 角标 */
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: var(--text-dim);
    font-weight: normal;
  }
  .badge.lan { background: rgba(52,211,153,0.15); color: var(--accent); }
  .badge.et { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .badge.nosd { background: rgba(245,158,11,0.15); color: var(--orange); }
  .badge.offline { background: rgba(239,68,68,0.15); color: var(--red); }

  /* SMB 极简备注 */
  .smb-memo {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  
  .footer { margin-top: auto; padding-top: 24px; font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="hub-tag">● PERSONAL WEB HUB</div>
<h1>个人<span>在线工具箱</span></h1>
<div class="sub">轻量 · 高效 · 纯本地浏览器运行</div>

<div class="grid">
  <!-- TVBox -->
  <div class="card">
    <span class="card-icon">📺</span>
    <div class="card-title">TVBox 线路解析</div>
    <div class="card-desc">解析接口配置，提取依赖文件，生成批量下载与打包。</div>
    <a href="#" class="card-link">打开 →</a>
  </div>

  <!-- 状态互查 -->
  <div class="card">
    <span class="card-icon">📊</span>
    <div class="card-title">状态互查 2.0</div>
    <div class="card-desc">方便快捷的数据对比与状态在线互查工具。</div>
    <a href="#" class="card-link">打开 →</a>
  </div>

  <!-- SD (带探测逻辑) -->
  <div class="card" id="sdCard">
    <span class="card-icon">🎨</span>
    <div class="card-title">
      Stable Diffusion 
      <span class="badge offline" id="sdBadge">检测中</span>
    </div>
    <div class="card-desc" id="sdDesc">AI 绘画本地服务。自动检测局域网与虚拟网，智能选最佳链路。</div>
    <a href="#" class="card-link" id="sdBtn" onclick="handleSD(event)">检测并打开 →</a>
    
    <!-- SMB 备忘 (极简融入底部) -->
    <div class="smb-memo">
      💡 SMB 备忘: 108 / 10.126.126.1:445 | App直连不中转<br>
      ⚠️ IP通但7860拒绝 = SD未启动 (去108开终端)
    </div>
  </div>
</div>

<div class="footer">局域网优先 · 虚拟网兜底</div>

<script>
  const LAN = 'http://192.168.0.108:7860';
  const ET = 'http://10.126.126.1:7860';
  let sdState = null; // true(lan) | 'et' | 'nosd' | false(offline)

  async function probe(url) {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 2500);
    try {
      await fetch(url, { method: 'HEAD', mode: 'no-cors', signal: ctrl.signal });
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return false;
      return 'nosd'; // 连接拒绝通常代表IP通但端口没服务
    }
  }

  async function runCheck() {
    const badge = document.getElementById('sdBadge');
    const desc = document.getElementById('sdDesc');
    const btn = document.getElementById('sdBtn');
    
    badge.className = 'badge offline'; badge.textContent = '检测中';
    btn.textContent = '检测中...'; btn.style.pointerEvents = 'none';

    const [rLan, rEt] = await Promise.all([probe(LAN), probe(ET)]);
    
    if (rLan === true) sdState = 'lan';
    else if (rEt === true) sdState = 'et';
    else if (rLan === 'nosd' || rEt === 'nosd') sdState = 'nosd';
    else sdState = 'offline';

    // 渲染
    if (sdState === 'lan') {
      badge.className = 'badge lan'; badge.textContent = '局域网';
      desc.textContent = '双链路通畅，优先 108 局域网。';
      btn.textContent = '进入 (局域网) →';
    } else if (sdState === 'et') {
      badge.className = 'badge et'; badge.textContent = '虚拟网';
      desc.textContent = '局域网不可达，已切到 EasyTier 虚拟网。';
      btn.textContent = '进入 (虚拟网) →';
    } else if (sdState === 'nosd') {
      badge.className = 'badge nosd'; badge.textContent = 'SD未启动';
      desc.textContent = 'IP通但 7860 拒绝，请去 108 机器开 SD！';
      btn.textContent = '刷新检测 →';
    } else {
      badge.className = 'badge offline'; badge.textContent = '离线';
      desc.textContent = '两条链路均不可达，检查网络或 EasyTier。';
      btn.textContent = '重试检测 →';
    }
    btn.style.pointerEvents = 'auto';
  }

  function handleSD(e) {
    e.preventDefault();
    if (sdState === null || sdState === 'offline' || sdState === 'nosd') {
      runCheck(); // 未检测或异常时先测
    } else {
      window.open(sdState === 'lan' ? LAN : ET, '_blank', 'noopener');
    }
  }

  // 初始静默检测
  runCheck();
</script>
</body>
</html>
