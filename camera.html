<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>粉色贺卡爱心</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 38%, #fff2f8 0%, #ffd6e7 36%, #ffb3d1 72%, #ff9ec7 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .scene {
    position: relative;
    width: min(92vw, 540px);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }

  .heart-wrap {
    position: absolute;
    inset: 0;
  }

  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(18px, 4.2vw, 28px);
    height: clamp(26px, 6vw, 40px);
    border-radius: 6px;
    background: linear-gradient(145deg, #fff4fa, #ffc4dc 70%, #ffabd0);
    border: 1px solid rgba(255, 255, 255, 0.95);
    box-shadow:
      0 4px 12px rgba(214, 51, 108, 0.18),
      inset 0 0 8px rgba(255, 255, 255, 0.8);
    display: grid;
    place-items: center;
    color: #c2255c;
    font-size: clamp(9px, 1.8vw, 12px);
    font-weight: 700;
    user-select: none;
    animation: glow 3.6s ease-in-out infinite;
    will-change: transform;
  }

  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); }
  }

  .central {
    position: relative;
    z-index: 5;
    text-align: center;
    color: #b4235a;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.9);
    pointer-events: none;
    transform: translateY(-8px);
  }

  .central h1 {
    margin: 0;
    font-size: clamp(22px, 5.4vw, 40px);
    letter-spacing: 0.08em;
  }

  .central p {
    margin: 10px 0 0;
    font-size: clamp(12px, 2.8vw, 16px);
    color: #c2255c;
    opacity: 0.92;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="heart-wrap" id="heart"></div>
    <div class="central">
      <h1>生日快乐</h1>
      <p>愿所有美好都奔向你 ❤</p>
    </div>
  </div>

  <script>
    const heart = document.getElementById("heart");
    const words = ["❤", "生", "日", "快", "乐", "❤", "平", "安", "好", "运"];
    const N = 42;
    const scale = 10.2;

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t));
      return { x, y };
    }

    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      const p = heartPoint(t);

      const card = document.createElement("div");
      card.className = "card";
      card.textContent = words[i % words.length];

      const angle = Math.atan2(p.y, p.x) * 180 / Math.PI - 90;
      const x = p.x * scale;
      const y = p.y * scale;

      card.style.transform =
        `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
      card.style.animationDelay = `${-i * 0.09}s`;

      heart.appendChild(card);
    }
  </script>
</body>
</html>
