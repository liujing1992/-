<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Camera</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000; font-family: -apple-system, sans-serif;
}

/* 视频全屏铺满，覆盖网址栏 */
video {
  width: 100%; height: 100%; object-fit: cover;
  position: fixed; top: 0; left: 0;
}
video.flipped { transform: scaleX(-1); }

/* 底部按钮栏 */
.controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center; align-items: center;
  gap: 12px; padding: 16px 20px 24px;
  background: linear-gradient(transparent, rgba(0,0,0,0.6));
  transition: opacity 0.8s ease;
  z-index: 10;
}
.controls.hidden { opacity: 0; pointer-events: none; }

button {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.8);
  background: rgba(0,0,0,0.35); backdrop-filter: blur(8px);
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: scale(0.92); background: rgba(255,255,255,0.2); }
button:disabled { opacity: 0.3; }
button.active { background: rgba(255,200,0,0.5); border-color: #ffc800; }

/* 状态提示 */
#status {
  position: fixed; top: env(safe-area-inset-top, 12px); left: 50%;
  transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,0.6);
  background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 12px;
  z-index: 10; pointer-events: none;
}

/* 全屏时隐藏浏览器UI的辅助 */
:fullscreen video { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div id="status">点击 ▶ 启动</div>

<div class="controls" id="controls">
  <button id="switchBtn" disabled title="切换镜头">🔄</button>
  <button id="startBtn" title="开关">▶</button>
  <button id="torchBtn" disabled title="补光灯">🔦</button>
</div>

<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const torchBtn = document.getElementById('torchBtn');
const status = document.getElementById('status');
const controls = document.getElementById('controls');

let currentStream = null;
let facingMode = 'environment';
let torchOn = false;
let videoTrack = null;
let hideTimer = null;

// ── 按钮自动隐藏逻辑 ──
function resetHideTimer() {
  controls.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    controls.classList.add('hidden');
  }, 2500);
}

// 触摸/点击任意处重置计时
document.addEventListener('touchstart', resetHideTimer);
document.addEventListener('click', resetHideTimer);

// ── 摄像头 ──
async function startCamera() {
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    const constraints = {
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 }, height: { ideal: 1080 }
      }, audio: false
    };
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    videoTrack = currentStream.getVideoTracks()[0];
    const settings = videoTrack.getSettings();

    video.classList.toggle('flipped', settings.facingMode === 'user');
    switchBtn.disabled = false;
    startBtn.textContent = '⏹';

    // torch
    if (videoTrack.getCapabilities && videoTrack.getCapabilities().torch !== undefined) {
      torchBtn.disabled = false; torchBtn.classList.remove('active');
    } else {
      torchBtn.disabled = true; torchBtn.classList.remove('active');
    }
    torchOn = false;
    status.textContent = settings.facingMode === 'user' ? '前置' : '后置';
    resetHideTimer();
  } catch (err) {
    status.textContent = '无法访问摄像头';
  }
}

function stopCamera() {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  video.srcObject = null;
  startBtn.textContent = '▶'; switchBtn.disabled = true; torchBtn.disabled = true;
  torchBtn.classList.remove('active'); status.textContent = '已关闭';
}

startBtn.onclick = (e) => { e.stopPropagation(); currentStream ? stopCamera() : startCamera(); };

switchBtn.onclick = (e) => {
  e.stopPropagation();
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  torchOn = false; startCamera();
};

torchBtn.onclick = async (e) => {
  e.stopPropagation();
  if (!videoTrack || !videoTrack.getCapabilities) return;
  try {
    torchOn = !torchOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
    torchBtn.classList.toggle('active', torchOn);
    status.textContent = torchOn ? '补光开' : '补光关';
    resetHideTimer();
  } catch (_) { torchOn = false; }
};

// 初始启动
startCamera();
</script>
</body>
</html>
