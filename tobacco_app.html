<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>烤烟分级 - 全局色温</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  #previewBox { position: relative; width: 100vw; height: 100vh; }
  video { width: 100%; height: 100%; object-fit: cover; }
  #info {
    position: absolute; top: 15px; left: 0; width: 100%; text-align: center;
    background: rgba(0,0,0,0.6); padding: 10px 0; font-size: 16px; z-index: 10;
  }
  canvas { display: none; }
  button {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 14px 40px; background: #00aa00; color: #fff; border: none;
    border-radius: 30px; font-size: 18px; z-index: 10;
  }
</style>
</head>
<body>
<div id="previewBox">
  <video id="video" autoplay playsinline></video>
  <div id="info">初始化中...</div>
  <button id="btn">打开摄像头</button>
  <canvas id="canvas"></canvas>
</div>
<script>
const btn = document.getElementById('btn');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
let stream = null;

// RGB 转开尔文色温（近似算法）
function rgbToKelvin(r, g, b) {
  let x = (-0.14282 * r) + (1.54924 * g) + (-0.95641 * b);
  let y = (-0.32466 * r) + (1.57837 * g) + (-0.73191 * b);
  let z = (-0.68202 * r) + (0.77073 * g) + (0.56332 * b);
  let xc = x / (x + y + z);
  let yc = y / (x + y + z);
  let n = (xc - 0.3320) / (0.1858 - yc);
  let k = 437 * Math.pow(n, 3) + 3601 * Math.pow(n, 2) + 6861 * n + 5517;
  return Math.round(k);
}

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    btn.style.display = 'none';
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      setInterval(checkGlobalColor, 1000); // 每秒测一次全局
    };
  } catch (e) {
    info.innerText = '打开失败：' + e.message;
  }
}

function checkGlobalColor() {
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  // 全局取样：遍历整幅画面
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let r=0, g=0, b=0, count=0;
  for (let i=0; i<data.length; i+=4) {
    r += data[i]; 
    g += data[i+1]; 
    b += data[i+2]; 
    count++;
  }
  r = Math.round(r/count); 
  g = Math.round(g/count); 
  b = Math.round(b/count);
  const k = rgbToKelvin(r, g, b);
  info.innerText = `全局色温：约 ${k}K | RGB(${r},${g},${b})`;
}
btn.onclick = startCam;
</script>
</body>
</html>
