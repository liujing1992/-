<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>烤烟分级 - 快速取色</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  #previewBox { position: relative; width: 100vw; height: 100vh; }
  video { width: 100%; height: 100%; object-fit: cover; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #overlay { z-index: 5; }
  #hidden { display: none; }
  #info {
    position: absolute; top: 15px; left: 0; width: 100%; text-align: center;
    background: rgba(0,0,0,0.7); padding: 10px 0; font-size: 15px; z-index: 10;
  }
  #hint {
    position: absolute; bottom: 80px; left: 0; width: 100%; text-align: center;
    font-size: 13px; color: #aaa; z-index: 10;
  }
  button {
    position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
    padding: 12px 32px; background: #00aa00; color: #fff; border: none;
    border-radius: 25px; font-size: 16px; z-index: 10;
  }
</style>
</head>
<body>
<div id="previewBox">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
  <canvas id="hidden"></canvas>
  <div id="info">点击"打开摄像头"，然后用手指圈出烟叶区域</div>
  <div id="hint">操作：在画面上拖动手指圈选烟叶 → 松手自动分析</div>
  <button id="btn">打开摄像头</button>
</div>
<script>
const btn = document.getElementById('btn');
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const hidden = document.getElementById('hidden');
const octx = overlay.getContext('2d');
const hctx = hidden.getContext('2d');
const info = document.getElementById('info');

let drawing = false;
let points = [];

async function startCam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    btn.style.display = 'none';
    video.onloadedmetadata = () => {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      hidden.width = video.videoWidth;
      hidden.height = video.videoHeight;
    };
  } catch (e) {
    info.innerText = '打开失败：' + e.message;
  }
}

overlay.addEventListener('pointerdown', e => {
  drawing = true;
  points = [{ x: e.offsetX, y: e.offsetY }];
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.beginPath();
  octx.moveTo(e.offsetX, e.offsetY);
});

overlay.addEventListener('pointermove', e => {
  if (!drawing) return;
  points.push({ x: e.offsetX, y: e.offsetY });
  octx.strokeStyle = '#00ff00';
  octx.lineWidth = 2;
  octx.lineTo(e.offsetX, e.offsetY);
  octx.stroke();
});

overlay.addEventListener('pointerup', () => {
  if (!drawing) return;
  drawing = false;
  analyzeRegion();
});

function analyzeRegion() {
  if (points.length < 5) { info.innerText = '圈太小，重新圈'; return; }

  hctx.drawImage(video, 0, 0, hidden.width, hidden.height);
  const imgData = hctx.getImageData(0, 0, hidden.width, hidden.height);
  const data = imgData.data;

  const minX = Math.min(...points.map(p => p.x));
  const maxX = Math.max(...points.map(p => p.x));
  const minY = Math.min(...points.map(p => p.y));
  const maxY = Math.max(...points.map(p => p.y));

  let r=0, g=0, b=0, count=0;

  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (pointInPolygon(x, y, points)) {
        const idx = (Math.floor(y) * hidden.width + Math.floor(x)) * 4;
        r += data[idx];
        g += data[idx+1];
        b += data[idx+2];
        count++;
      }
    }
  }

  if (count === 0) { info.innerText = '圈内无像素'; return; }

  r = Math.round(r/count);
  g = Math.round(g/count);
  b = Math.round(b/count);

  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let category = '';

  if (r > g && r > b && r > 150) category = '红棕/深橘';
  else if (g > r * 0.9 && g > b && g > 120) category = '橘黄/正黄';
  else if (max < 100) category = '暗褐/焦枯';
  else if (b > r && b > g) category = '杂色(偏蓝)';
  else if (max - min < 30) category = '灰杂/褪色';
  else category = '其他';

  info.innerText = `圈内 ${count} 像素 | 平均 RGB(${r},${g},${b}) | 主色:${category}`;

  octx.strokeStyle = '#ffff00';
  octx.lineWidth = 3;
  octx.beginPath();
  octx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) octx.lineTo(points[i].x, points[i].y);
  octx.closePath();
  octx.stroke();
}

function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    if (((poly[i].y > y) !== (poly[j].y > y)) &&
        (x < (poly[j].x - poly[i].x) * (y - poly[i].y) / (poly[j].y - poly[i].y) + poly[i].x)) {
      inside = !inside;
    }
  }
  return inside;
}

btn.onclick = startCam;
</script>
</body>
</html>
