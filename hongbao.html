<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>财神送福 · 红包雨</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;touch-action:none;font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;}
  body{
    /* 金色光晕模糊背景 */
    background:
      radial-gradient(circle at 50% 18%, rgba(255,226,150,.75), transparent 42%),
      radial-gradient(circle at 20% 70%, rgba(255,190,90,.40), transparent 45%),
      radial-gradient(circle at 82% 62%, rgba(255,205,120,.45), transparent 45%),
      linear-gradient(170deg,#7a4a0a 0%,#b7791f 38%,#e8b34a 68%,#f6d98a 100%);
    position:relative;
  }
  /* 散景光斑 */
  body::before{
    content:"";position:fixed;inset:-10%;
    background:
      radial-gradient(circle at 12% 22%, rgba(255,255,255,.55) 0 4vw, transparent 5vw),
      radial-gradient(circle at 88% 14%, rgba(255,255,255,.40) 0 6vw, transparent 7.5vw),
      radial-gradient(circle at 70% 88%, rgba(255,255,255,.35) 0 5vw, transparent 6.5vw),
      radial-gradient(circle at 30% 80%, rgba(255,255,255,.30) 0 3.5vw, transparent 5vw);
    filter:blur(14px);z-index:0;pointer-events:none;
  }
  /* 财神剪影 */
  #god{
    position:fixed;left:50%;bottom:-2vh;transform:translateX(-50%);
    height:62vh;z-index:0;pointer-events:none;opacity:.55;
    filter:blur(3.5px) drop-shadow(0 0 24px rgba(255,210,120,.7));
  }
  #game{position:relative;z-index:2;height:100%;width:100%;}

  /* HUD */
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
    color:#5a2e00;font-weight:800;text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .chip{background:rgba(255,255,255,.55);backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,255,255,.8);border-radius:999px;
    padding:8px 16px;font-size:18px;letter-spacing:.5px;}
  #timer{font-variant-numeric:tabular-nums;}
  #hud small{display:block;font-size:10px;font-weight:700;opacity:.7;letter-spacing:2px;}

  /* 红包 */
  .hb{
    position:absolute;top:-90px;z-index:3;cursor:pointer;
    transform-origin:center center;
    animation:fall linear forwards;
    filter:drop-shadow(0 8px 14px rgba(120,30,0,.45));
  }
  .hb:active{transform:scale(.88)!important;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
  .pkt{
    position:relative;border-radius:22px;overflow:hidden;
    background:linear-gradient(160deg,#ff4d3d 0%,#e0251a 55%,#b3100a 100%);
    box-shadow:inset 0 6px 14px rgba(255,255,255,.35),inset 0 -8px 16px rgba(0,0,0,.22);
  }
  .pkt::before{content:"";position:absolute;top:0;left:0;right:0;height:34%;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));}
  .pkt::after{content:"福";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;
    color:#ffe9a8;font-weight:900;text-shadow:0 2px 6px rgba(120,0,0,.5);}
  .gold{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:30%;height:0;padding-bottom:30%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3c4,#ffcf4a 45%,#c98a10 100%);
    box-shadow:0 0 0 5px rgba(255,255,255,.35);z-index:1;}
  .pkt.small{width:64px;height:80px;}
  .pkt.small::after{font-size:26px;}
  .pkt.mid{width:86px;height:108px;}
  .pkt.mid::after{font-size:34px;}
  .pkt.big{width:118px;height:148px;}
  .pkt.big::after{font-size:46px;content:"福";}
  .pkt.big .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    color:#ffe9a8;font-size:26px;z-index:3;text-shadow:0 2px 4px rgba(0,0,0,.4);}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(0)}}
  .hb.pop{animation:pop .28s ease-out forwards;pointer-events:none;}

  /* 飘分 */
  .float{position:absolute;z-index:6;font-weight:900;font-size:30px;
    color:#fff3c4;text-shadow:0 2px 8px rgba(180,40,0,.8);pointer-events:none;
    animation:up .7s ease-out forwards;}
  @keyframes up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}

  /* 面板 */
  .panel{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:rgba(70,30,0,.55);backdrop-filter:blur(10px);padding:24px;}
  .card{background:linear-gradient(170deg,#fff3cf,#ffd97a 60%,#f0b94a);
    border:3px solid #fff;border-radius:32px;padding:34px 30px 30px;max-width:340px;width:88%;
    box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .card h1{font-size:44px;color:#b3100a;letter-spacing:4px;
    text-shadow:0 2px 0 #fff,0 4px 8px rgba(180,40,0,.3);}
  .card .sub{margin-top:6px;font-size:15px;color:#8a4a10;font-weight:700;letter-spacing:2px;}
  .score-big{font-size:76px;font-weight:900;color:#c98a10;line-height:1.05;
    text-shadow:0 3px 0 #fff,0 6px 12px rgba(180,80,0,.35);}
  .score-big em{font-style:normal;font-size:30px;color:#b3100a;}
  .btn{margin-top:22px;padding:16px 46px;border:none;border-radius:999px;cursor:pointer;
    font-size:22px;font-weight:900;letter-spacing:3px;color:#7a1d00;
    background:linear-gradient(180deg,#ffe9a8,#ffb84a);
    box-shadow:0 6px 0 #c98a10,0 10px 20px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98a10;}
  .hint{margin-top:16px;font-size:12.5px;color:#6b3a10;font-weight:700;line-height:1.7;}
  #start .rule{margin:16px 0 4px;font-size:14px;color:#7a2e00;line-height:1.9;font-weight:700;}
  .hidden{display:none!important;}
  .fire{font-size:40px;letter-spacing:6px;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.12)}}
</style>
</head>
<body>
  <!-- 财神剪影（纯 SVG 路径，无图片依赖） -->
  <svg id="god" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a2e00" stop-opacity=".9"/>
        <stop offset="1" stop-color="#2a1200" stop-opacity=".95"/>
      </linearGradient>
    </defs>
    <!-- 身体袍子 -->
    <path d="M40 400 Q30 300 60 240 Q80 200 100 190 Q120 200 140 240 Q170 300 160 400 Z" fill="url(#g)"/>
    <!-- 宽袖 -->
    <path d="M60 240 Q10 250 20 330 Q25 370 50 400 Q55 340 70 280 Z" fill="#3d1c00" opacity=".85"/>
    <path d="M140 240 Q190 250 180 330 Q175 370 150 400 Q145 340 130 280 Z" fill="#3d1c00" opacity=".85"/>
    <!-- 元宝 -->
    <ellipse cx="100" cy="305" rx="34" ry="20" fill="#f6d98a" opacity=".9"/>
    <ellipse cx="78" cy="312" rx="14" ry="16" fill="#e8b34a" opacity=".8"/>
    <ellipse cx="122" cy="312" rx="14" ry="16" fill="#e8b34a" opacity=".8"/>
    <!-- 头/帽 -->
    <ellipse cx="100" cy="150" rx="46" ry="44" fill="url(#g)"/>
    <path d="M54 130 Q100 70 146 130 Q140 100 100 88 Q60 100 54 130 Z" fill="#7a3d00"/>
    <rect x="66" y="112" width="68" height="14" rx="6" fill="#f6d98a" opacity=".85"/>
    <!-- 胡子 -->
    <path d="M78 190 Q100 215 122 190 Q110 205 100 210 Q90 205 78 190 Z" fill="#fff3cf" opacity=".8"/>
    <!-- 笑眼 -->
    <path d="M82 158 Q90 150 98 158" stroke="#ffe9a8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M102 158 Q110 150 118 158" stroke="#ffe9a8" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>

<div id="game"></div>

<div id="hud" class="hidden">
  <div class="chip">🧧 <span id="score">0</span> 分</div>
  <div class="chip" style="text-align:right"><small>剩余</small><span id="timer">30</span></div>
</div>

<!-- 开始面板 -->
<div id="start" class="panel">
  <div class="card">
    <div class="fire">🧧🎊🧧</div>
    <h1>财神送福</h1>
    <div class="sub">红包从天降 · 点中得分</div>
    <div class="rule">
      点小包 <b>+1</b>　点中包 <b>+3</b>　点大包 <b>+10</b> 🪙<br>
      一共 30 秒，越到后头掉得越快<br>
      漏掉不扣分，只管猛戳！
    </div>
    <button class="btn" id="playBtn">开 抢</button>
    <div class="hint">静音？点一下屏幕再开抢，语音就能响<br>单文件离线可玩 · 电脑手机都行</div>
  </div>
</div>

<!-- 结算面板 -->
<div id="over" class="panel hidden">
  <div class="card">
    <div class="fire" id="overFire">🎉🧧🎉</div>
    <h1 id="overTitle">你真棒！</h1>
    <div class="sub" id="overSub">财神爷给你竖大拇指</div>
    <div class="score-big"><span id="final">0</span><em>分</em></div>
    <div class="hint" id="overMsg"></div>
    <button class="btn" id="againBtn">再 来 一 局</button>
  </div>
</div>

<script>
(function(){
  const game=document.getElementById('game');
  const scoreEl=document.getElementById('score');
  const timerEl=document.getElementById('timer');
  const startP=document.getElementById('start');
  const overP=document.getElementById('over');
  const hud=document.getElementById('hud');

  let score=0,running=false,secs=30,timerId=null,spawnId=null,fallTime=5200,minGap=900,maxGap=1700;

  // 浏览器合成语音：财神爷腔调靠语速+音高调出来
  function speak(text){
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; u.rate=0.92; u.pitch=1.35; u.volume=1;
      // 优先选中文女声/童声，没有就走默认
      const voices=speechSynthesis.getVoices();
      const v=voices.find(x=>/zh/i.test(x.lang) && /female|xiaoxiao|mei|ting|xuan/i.test(x.name))
           || voices.find(x=>/zh/i.test(x.lang));
      if(v) u.voice=v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){/* 静默降级，不影响游戏 */}
  }
  // 语音列表异步加载，提前触发一下让用户点屏幕激活（iOS/安卓要求手势激活）
  speechSynthesis.getVoices();

  function rnd(a,b){return Math.random()*(b-a)+a;}

  function spawn(){
    if(!running) return;
    const wrap=document.documentElement.clientWidth||window.innerWidth;
    const t=document.createElement('div');
    t.className='hb';
    const size=Math.random();
    let kind,val,label;
    if(size<0.55){kind='small';val=1;label='+1';}
    else if(size<0.88){kind='mid';val=3;label='+3';}
    else{kind='big';val=10;label='+10';}

    t.style.left=rnd(8, wrap-120)+'px';
    t.style.animationDuration=fallTime+'ms';
    t.innerHTML=`<div class="pkt ${kind}">${kind==='big'?'<span class="crown">👑</span>':''}<span class="gold"></span></div>`;
    t.dataset.val=val;
    t.dataset.label=label;

    t.addEventListener('pointerdown',e=>{
      e.preventDefault();
      if(!running) return;
      hit(t,label);
    },{passive:false});
    game.appendChild(t);
    setTimeout(()=>{ if(t.parentNode) t.remove(); }, fallTime+400);

    // 难度：时间越往后，红包越多、掉得越快
    const progress=1-Math.max(0,secs)/30;          // 0→1
    fallTime=Math.max(2200, 5200*(1-progress*0.62)); // 最慢5.2s→最快2.2s
    const gap=Math.max(380, rnd(minGap,maxGap)*(1-progress*0.55));
    spawnId=setTimeout(spawn, gap);
  }

  function hit(t,label){
    t.classList.add('pop');
    score+=+t.dataset.val;
    scoreEl.textContent=score;
    const f=document.createElement('div');
    f.className='float';
    f.textContent=label;
    f.style.left=t.style.left;
    f.style.top=(t.getBoundingClientRect().top-20)+'px';
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),750);
    setTimeout(()=>{ if(t.parentNode) t.remove(); },260);
  }

  function end(){
    running=false;
    clearTimeout(spawnId); clearInterval(timerId);
    [...game.children].forEach(c=>c.remove());
    hud.classList.add('hidden');
    overP.classList.remove('hidden');

    const f=document.getElementById('final'); f.textContent=score;
    const title=document.getElementById('overTitle');
    const sub=document.getElementById('overSub');
    const msg=document.getElementById('overMsg');
    const fire=document.getElementById('overFire');
    let words,emo;
    if(score>=150){words='你真棒！';emo='🏆🧧🏆';sub.textContent='财神爷当场给你封了个大红包！';msg.textContent='满分欧气，今年钱包鼓鼓的～';}
    else if(score>=80){words='你真棒！';emo='🎉🧧🎉';sub.textContent='财神爷给你竖大拇指';msg.textContent='手速和运气都顶呱呱！';}
    else if(score>=30){words='你也棒！';emo='👏🧧👏';sub.textContent='财神爷笑眯眯地点头';msg.textContent='再来一局，大红包等你戳～';}
    else{words='你也很棒！';emo='🤗🧧🤗';sub.textContent='财神爷摸摸头';msg.textContent='小手慢一点也没关系，大包专治手慢～';}
    title.textContent=words; fire.textContent=emo;
    speak(words+' 得了'+score+'分！');
  }

  function start(){
    score=0; secs=30; fallTime=5200; minGap=900; maxGap=1700;
    scoreEl.textContent='0'; timerEl.textContent='30';
    startP.classList.add('hidden'); overP.classList.add('hidden');
    hud.classList.remove('hidden');
    running=true;
    spawn();
    timerId=setInterval(()=>{
      secs--;
      timerEl.textContent=secs;
      if(secs<=0){ timerEl.textContent='0'; end(); }
    },1000);
  }

  document.getElementById('playBtn').addEventListener('click',start);
  document.getElementById('againBtn').addEventListener('click',start);
  // 首屏点一下激活语音（移动端必须）
  document.body.addEventListener('pointerdown',()=>{ speechSynthesis.getVoices(); },{once:true});
})();
</script>
</body>
</html>
