<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>哥布林猎手 - AR小游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; touch-action: none; }

#camera-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0;
}

#game-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1;
}

/* UI层 */
#ui-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10; pointer-events: none;
}

#hp-bar {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  width: 80%; max-width: 400px; height: 24px;
  background: rgba(0,0,0,0.7); border: 2px solid #ff4444; border-radius: 12px;
  overflow: hidden;
}
#hp-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ff4444, #ff8888);
  transition: width 0.3s;
}

#hero-hp {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  width: 60%; max-width: 300px; height: 18px;
  background: rgba(0,0,0,0.7); border: 2px solid #44ff44; border-radius: 9px;
  overflow: hidden;
}
#hero-hp-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #44ff44, #88ff88);
  transition: width 0.3s;
}

#info {
  position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 14px; text-shadow: 1px 1px 2px #000;
  text-align: center;
}

#controls {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 180px;
  pointer-events: auto;
}

#btn-attack {
  position: absolute; bottom: 30px; right: 30px;
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,50,50,0.8); border: 3px solid #fff;
  color: #fff; font-size: 16px; font-weight: bold;
  pointer-events: auto; touch-action: manipulation;
}
#btn-block {
  position: absolute; bottom: 30px; right: 130px;
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(50,100,255,0.8); border: 3px solid #fff;
  color: #fff; font-size: 16px; font-weight: bold;
  pointer-events: auto; touch-action: manipulation;
}
#btn-move-left {
  position: absolute; bottom: 30px; left: 30px;
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(255,255,255,0.3); border: 2px solid #fff;
  color: #fff; font-size: 24px;
  pointer-events: auto;
}
#btn-move-right {
  position: absolute; bottom: 30px; left: 110px;
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(255,255,255,0.3); border: 2px solid #fff;
  color: #fff; font-size: 24px;
  pointer-events: auto;
}

#start-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff;
}
#start-screen h1 { font-size: 32px; margin-bottom: 10px; color: #ff4444; }
#start-screen p { font-size: 16px; margin-bottom: 30px; opacity: 0.8; }
#btn-start {
  padding: 15px 40px; font-size: 20px; font-weight: bold;
  background: #ff4444; color: #fff; border: none; border-radius: 30px;
}

#msg {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #fff; font-size: 24px; font-weight: bold;
  text-shadow: 2px 2px 4px #000;
  opacity: 0; transition: opacity 0.5s;
}

#position-indicator {
  position: absolute; top: 100px; right: 20px;
  color: #fff; font-size: 12px; text-align: right;
  background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px;
}
</style>
</head>
<body>

<video id="camera-bg" autoplay playsinline muted></video>
<canvas id="game-canvas"></canvas>

<div id="ui-layer">
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div id="hero-hp"><div id="hero-hp-fill"></div></div>
  <div id="info">哥布林 Lv.1</div>
  <div id="position-indicator">位置: 正面</div>
  <div id="msg"></div>
  <div id="controls">
    <button id="btn-move-left">⟲</button>
    <button id="btn-move-right">⟳</button>
    <button id="btn-block">🛡</button>
    <button id="btn-attack">⚔</button>
  </div>
</div>

<div id="start-screen">
  <h1>🗡 哥布林猎手</h1>
  <p>摄像头AR · 3D战斗 · 绕后背刺</p>
  <button id="btn-start">开始狩猎</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ========== 游戏状态 ==========
const STATE = {
  started: false,
  heroAngle: 0,          // 英雄在哥布林周围的角度 (弧度)
  heroDistance: 3,       // 英雄离哥布林的距离
  goblinHP: 100,
  heroHP: 100,
  goblinMaxHP: 100,
  heroMaxHP: 100,
  attacking: false,
  blocking: false,
  blockTimer: 0,
  attackCooldown: 0,
  goblinState: 'idle',   // idle, attack, hit, dead
  goblinAnimTimer: 0,
  goblinAttackTimer: 0,
  goblinAttackCooldown: 0,
  messageTimer: 0,
  gameOver: false,
  victory: false,
  angleSpeed: 1.2,       // 绕行速度
};

// ========== 摄像头 ==========
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: 1280, height: 720 },
      audio: false
    });
    const video = document.getElementById('camera-bg');
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    console.log('摄像头启动失败，使用纯色背景', e);
  }
}

// ========== Three.js 初始化 ==========
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 6);
camera.lookAt(0, 0, 0);

// 灯光
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);

// ========== 地面 ==========
const groundGeo = new THREE.CircleGeometry(5, 32);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, transparent: true, opacity: 0.7 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;
scene.add(ground);

// ========== 哥布林（用几何体拼） ==========
const goblin = new THREE.Group();

// 身体
const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.6, 8, 16);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a7a3a });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.3;
goblin.add(body);

// 头
const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
const headMat = new THREE.MeshStandardMaterial({ color: 0x5a8a4a });
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 1.0;
goblin.add(head);

// 眼睛
const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
leftEye.position.set(-0.08, 1.05, 0.22);
goblin.add(leftEye);
const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
rightEye.position.set(0.08, 1.05, 0.22);
goblin.add(rightEye);

// 手臂
const armGeo = new THREE.CapsuleGeometry(0.1, 0.4, 4, 8);
const leftArm = new THREE.Mesh(armGeo, bodyMat);
leftArm.position.set(-0.5, 0.5, 0);
leftArm.rotation.z = 0.3;
goblin.add(leftArm);
const rightArm = new THREE.Mesh(armGeo, bodyMat);
rightArm.position.set(0.5, 0.5, 0);
rightArm.rotation.z = -0.3;
goblin.add(rightArm);

// 武器（木棒）
const clubGeo = new THREE.BoxGeometry(0.08, 0.6, 0.08);
const clubMat = new THREE.MeshStandardMaterial({ color: 0x6b4226 });
const club = new THREE.Mesh(clubGeo, clubMat);
club.position.set(0.5, 0.2, 0.3);
goblin.add(club);

// 腿
const legGeo = new THREE.CapsuleGeometry(0.12, 0.4, 4, 8);
const leftLeg = new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x3a5a2a }));
leftLeg.position.set(-0.15, -0.5, 0);
goblin.add(leftLeg);
const rightLeg = new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({ color: 0x3a5a2a }));
rightLeg.position.set(0.15, -0.5, 0);
goblin.add(rightLeg);

scene.add(goblin);

// ========== 英雄（刀盾战士简化模型） ==========
const hero = new THREE.Group();

const hBodyGeo = new THREE.CapsuleGeometry(0.3, 0.7, 8, 16);
const hBodyMat = new THREE.MeshStandardMaterial({ color: 0x4444aa });
const hBody = new THREE.Mesh(hBodyGeo, hBodyMat);
hBody.position.y = 0.35;
hero.add(hBody);

const hHeadGeo = new THREE.SphereGeometry(0.22, 16, 16);
const hHeadMat = new THREE.MeshStandardMaterial({ color: 0xffcc88 });
const hHead = new THREE.Mesh(hHeadGeo, hHeadMat);
hHead.position.y = 1.1;
hero.add(hHead);

// 盾牌
const shieldGeo = new THREE.BoxGeometry(0.5, 0.7, 0.05);
const shieldMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7, roughness: 0.3 });
const shield = new THREE.Mesh(shieldGeo, shieldMat);
shield.position.set(-0.4, 0.3, 0.2);
hero.add(shield);

// 刀
const swordGeo = new THREE.BoxGeometry(0.06, 0.8, 0.03);
const swordMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
const sword = new THREE.Mesh(swordGeo, swordMat);
sword.position.set(0.4, 0.3, 0.2);
hero.add(sword);

scene.add(hero);

// ========== 血条伤害数字 ==========
const damageNumbers = [];

function showDamage(amount, isCrit) {
  damageNumbers.push({
    text: isCrit ? `💥${amount}!` : `-${amount}`,
    timer: 1.0,
    y: 1.5,
    crit: isCrit
  });
}

// ========== 输入处理 ==========
let moveDir = 0; // -1左 0停 1右

document.getElementById('btn-move-left').addEventListener('touchstart', (e) => { e.preventDefault(); moveDir = -1; });
document.getElementById('btn-move-left').addEventListener('touchend', (e) => { e.preventDefault(); if (moveDir === -1) moveDir = 0; });
document.getElementById('btn-move-left').addEventListener('mousedown', () => moveDir = -1);
document.getElementById('btn-move-left').addEventListener('mouseup', () => { if (moveDir === -1) moveDir = 0; });

document.getElementById('btn-move-right').addEventListener('touchstart', (e) => { e.preventDefault(); moveDir = 1; });
document.getElementById('btn-move-right').addEventListener('touchend', (e) => { e.preventDefault(); if (moveDir === 1) moveDir = 0; });
document.getElementById('btn-move-right').addEventListener('mousedown', () => moveDir = 1);
document.getElementById('btn-move-right').addEventListener('mouseup', () => { if (moveDir === 1) moveDir = 0; });

document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); doAttack(); });
document.getElementById('btn-attack').addEventListener('click', doAttack);

document.getElementById('btn-block').addEventListener('touchstart', (e) => { e.preventDefault(); STATE.blocking = true; STATE.blockTimer = 1.0; });
document.getElementById('btn-block').addEventListener('touchend', (e) => { e.preventDefault(); STATE.blocking = false; });
document.getElementById('btn-block').addEventListener('mousedown', () => { STATE.blocking = true; STATE.blockTimer = 1.0; });
document.getElementById('btn-block').addEventListener('mouseup', () => { STATE.blocking = false; });

function doAttack() {
  if (STATE.attackCooldown > 0 || STATE.gameOver) return;
  STATE.attacking = true;
  STATE.attackCooldown = 0.5;

  // 计算伤害
  const angleDeg = Math.abs(STATE.heroAngle % (Math.PI * 2));
  const isBack = angleDeg > 1.57 && angleDeg < 4.71; // 背面区域
  let dmg = isBack ? 35 : 15; // 背刺暴击
  let crit = isBack;

  if (STATE.blocking) { dmg = Math.floor(dmg * 0.3); crit = false; }

  STATE.goblinHP -= dmg;
  showDamage(dmg, crit);

  if (STATE.goblinHP <= 0) {
    STATE.goblinHP = 0;
    STATE.victory = true;
    STATE.gameOver = true;
    showMessage('🎉 胜利！哥布林已击杀！');
  }

  STATE.goblinState = 'hit';
  STATE.goblinAnimTimer = 0.3;
}

function showMessage(text) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.style.opacity = 1;
  STATE.messageTimer = 2.0;
}

// ========== 哥布林AI ==========
function goblinAI(dt) {
  if (STATE.goblinState === 'dead' || STATE.victory) return;

  STATE.goblinAttackCooldown -= dt;

  // 哥布林面向英雄
  const targetRotation = -STATE.heroAngle + Math.PI;
  goblin.rotation.y += (targetRotation - goblin.rotation.y) * 5 * dt;

  if (STATE.goblinState === 'hit') {
    STATE.goblinAnimTimer -= dt;
    goblin.position.x = Math.sin(Date.now() * 0.05) * 0.1;
    if (STATE.goblinAnimTimer <= 0) {
      STATE.goblinState = 'idle';
      goblin.position.x = 0;
    }
    return;
  }

  // 攻击逻辑
  if (STATE.goblinAttackCooldown <= 0) {
    const dist = STATE.heroDistance;
    if (dist < 4) {
      STATE.goblinState = 'attack';
      STATE.goblinAttackTimer = 0.5;
      STATE.goblinAttackCooldown = 2.0;
    }
  }

  if (STATE.goblinState === 'attack') {
    STATE.goblinAttackTimer -= dt;
    // 武器挥动
    club.rotation.x = Math.sin(STATE.goblinAttackTimer * 10) * 1.5;

    if (STATE.goblinAttackTimer <= 0) {
      STATE.goblinState = 'idle';
      club.rotation.x = 0;

      // 判定命中
      const dist = STATE.heroDistance;
      if (dist < 4) {
        let dmg = 12;
        if (STATE.blocking) {
          dmg = Math.floor(dmg * 0.2);
          showMessage('🛡 格挡！');
        } else {
          showMessage('💢 受到攻击！');
        }
        STATE.heroHP -= dmg;
        if (STATE.heroHP <= 0) {
          STATE.heroHP = 0;
          STATE.gameOver = true;
          showMessage('☠️ 你被哥布林杀死了...');
        }
      }
    }
  }
}

// ========== 更新英雄位置 ==========
function updateHero() {
  // 绕行
  if (moveDir !== 0 && !STATE.gameOver) {
    STATE.heroAngle += moveDir * STATE.angleSpeed * (1/60);
  }

  // 计算位置
  const x = Math.sin(STATE.heroAngle) * STATE.heroDistance;
  const z = Math.cos(STATE.heroAngle) * STATE.heroDistance;

  hero.position.set(x, 0, z);
  hero.rotation.y = -STATE.heroAngle + Math.PI;

  // 更新UI位置指示
  const angleDeg = Math.abs(STATE.heroAngle % (Math.PI * 2));
  let posText = '正面';
  if (angleDeg > 0.78 && angleDeg < 2.36) posText = '右侧';
  else if (angleDeg >= 2.36 && angleDeg <= 4.71) posText = '🎯 背面！';
  else if (angleDeg > 4.71 && angleDeg < 5.5) posText = '左侧';

  document.getElementById('position-indicator').textContent = `位置: ${posText}`;
}

// ========== 渲染循环 ==========
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (!STATE.started) {
    renderer.render(scene, camera);
    return;
  }

  // 更新
  if (STATE.attackCooldown > 0) STATE.attackCooldown -= dt;
  if (STATE.blockTimer > 0) { STATE.blockTimer -= dt; if (STATE.blockTimer <= 0) STATE.blocking = false; }
  if (STATE.messageTimer > 0) {
    STATE.messageTimer -= dt;
    if (STATE.messageTimer <= 0) document.getElementById('msg').style.opacity = 0;
  }

  // 哥布林动画
  if (STATE.goblinState === 'idle') {
    body.scale.y = 1 + Math.sin(now * 0.003) * 0.02;
    head.rotation.y = Math.sin(now * 0.002) * 0.2;
  }

  // 英雄攻击动画
  if (STATE.attacking) {
    sword.rotation.z = Math.sin(now * 0.02) * 2;
    hero.position.y = Math.abs(Math.sin(now * 0.015)) * 0.3;
    if (now % 500 < 50) { STATE.attacking = false; sword.rotation.z = 0; hero.position.y = 0; }
  }

  // 格挡姿态
  if (STATE.blocking) {
    shield.position.x = -0.2;
    shield.rotation.y = 0.3;
  } else {
    shield.position.x = -0.4;
    shield.rotation.y = 0;
  }

  goblinAI(dt);
  updateHero();

  // 相机跟随
  camera.position.set(0, 2 + STATE.heroHP / 100, 6 - STATE.heroHP / 200);
  camera.lookAt(0, 0.5, 0);

  // UI更新
  document.getElementById('hp-fill').style.width = (STATE.goblinHP / STATE.goblinMaxHP * 100) + '%';
  document.getElementById('hero-hp-fill').style.width = (STATE.heroHP / STATE.heroMaxHP * 100) + '%';

  // 伤害数字
  damageNumbers.forEach((dn, i) => {
    dn.timer -= dt;
    dn.y += dt * 0.5;
    if (dn.timer <= 0) damageNumbers.splice(i, 1);
  });

  renderer.render(scene, camera);
}

// ========== 启动 ==========
document.getElementById('btn-start').addEventListener('click', async () => {
  document.getElementById('start-screen').style.display = 'none';
  await startCamera();
  STATE.started = true;
});

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
